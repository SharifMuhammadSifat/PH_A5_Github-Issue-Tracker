<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <title>Github Issue Tracker</title>
</head>
<body class="bg-[#F8FAFC] min-h-screen">
    <div id="login-container" class="flex justify-center items-center hidden">
        <fieldset class="fieldset bg-[#ffffff] border-base-300 rounded-box border p-8 h-[743px] w-[520px] flex flex-col gap-6 justify-center items-center shadow-2xl my-16 mx-60">

            <img src="assets/github-logo.png" alt="">

            <div>
                <h1 class="text-2xl font-semibold text-[#1F2937]">GitHub Issues Tracker</h1>
                <p class="text-[16px] text-[#64748B]">Sign in to manage your issues</p>
            </div>

            <div class="w-full">
                <label class="label text-[16px] text-black font-medium">Username</label>
                <input type="text" id="input-name" class="w-full" placeholder="Enter Username" />
                <p class="text-[#4A00FF]">Default: admin</p>
            </div>

            <div class="w-full">
                <label class="label text-[16px] text-black font-medium">Password</label>
                <input type="password" id="input-pass" class="w-full" placeholder="Enter Password" />
                <p class="text-[#4A00FF]">Default: admin123</p>
            </div>

            <button id="submit" class="btn btn-primary mt-4 w-full rounded-lg">Sign In</button>

            <div class="flex items-center w-full">
              <div class="flex-1 h-px bg-gray-300"></div>
              <span class="px-4 text-black-500">OR</span>
              <div class="flex-1 h-px bg-gray-300"></div>
            </div>

            <div class="w-full flex flex-col items-center">
                <p class="text-[#64748B]">Demo Credentials:</p>

                <div class="w-full bg-[#F8FAFC] flex flex-col justify-center items-center p-6">

                    <div><span class="font-semibold text-[16px]">Username:</span> <span class="text-[16px]">admin</span></div>
                    <div><span class="font-semibold text-[16px]">Password:</span><span class="text-[16px]">admin123</span></div>
                </div>

            </div>

        </fieldset>
    </div>

    <div id="main-page-container" class="w-full h-20 bg-white">

        <nav class="flex justify-between items-center px-20 py-4 shadow">
            <div class="logo flex gap-1">
                <img src="assets/github-logo.png" class="w-9 h-9" alt="">
                <p class="text-2xl font-semibold">GitHub Issues Tracker</p>
            </div>

            <div class="search flex items-center gap-1 relative">
                <span class="absolute translate-x-1 translate-y-px"><i class="fa-brands fa-sistrix fa-sm" style="color: rgb(181, 190, 198);"></i></span>
                <input type="text" class="w-75 h-11 border-2 border-gray-300 rounded-lg p-2.5" placeholder="   Search Issue">
                <button class="btn btn-primary text-white"><i class="fa-solid fa-plus fa-sm" style="color: rgb(255, 255, 255);"></i>New Issue</button>
            </div>
        </nav>

        <section class="px-61 py-15 w-full">
            <div class="button-container w-full h-22 bg-white p-6 flex gap-2">
                <button id="all-btn" class="btn btn-primary h-10 w-30 text-white">All</button>
                <button id="open-btn" class="btn h-10 w-30 text-gray-500">Open</button>
                <button id="close-btn" class="btn h-10 w-30 text-gray-500">Closed</button>
            </div>
            <section>
                <div id="all-tab" class="">
                    all
                </div>

                <div id="open-tab" class="hidden">
                    open
                </div>

                <div id="close-tab" class="hidden">
                    close
                </div>
            </section>
        </section>

        

    </div>

      </div>
      <label class="modal-backdrop" for="my_modal_7">Close</label>
    </div> -->
    <script src="backend.js"></script>
</body>
</html>
